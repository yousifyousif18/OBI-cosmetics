<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Obi.Cosmetics</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <nav class="navbar">

            <a href="index.html" class="logo">
                Obi Cosmetics 
            </a>

            <button class="menu-button">
                Menu
            </button>

        </nav>
    </header>


    <main>

        <section class="hero">

            <h1>
                Discover Our Products
            </h1>

            <p>
                Quality products delivered directly to you.
            </p>

            <a href="#products" class="shop-button">
                Shop Now
            </a>

        </section>


        <section id="products" class="products-section">

            <h2>Best Sellers</h2>

            <div class="product-grid">

                <article class="product-card">
                    <div class="product-image">
                        Product Image
                    </div>

                    <h3>Product One</h3>

                    <p>RM 50</p>

                    <button>
                        Add to Cart
                    </button>
                </article>


                <article class="product-card">
                    <div class="product-image">
                        Product Image
                    </div>

                    <h3>Product Two</h3>

                    <p>RM 70</p>

                    <button>
                        Add to Cart
                    </button>
                </article>


                <article class="product-card">
                    <div class="product-image">
                        Product Image
                    </div>

                    <h3>Product Three</h3>

                    <p>RM 90</p>

                    <button>
                        Add to Cart
                    </button>
                </article>


                <article class="product-card">
                    <div class="product-image">
                        Product Image
                    </div>

                    <h3>Product Four</h3>

                    <p>RM 100</p>

                    <button>
                        Add to Cart
                    </button>
                </article>

            </div>

        </section>

    </main>


    <footer>

        <p>
            © 2026 Obi Cosmetics
        </p>

    </footer>


    <script src="script.js"></script>

</body>

</html>
