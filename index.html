<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Obi.Cosmetics</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <nav class="navbar">

            <a href="index.html" class="logo">

               <img
                 src="images/brand/logo.webp"
                 alt="Obi Cosmetics logo"
                 class="brand-logo"
                >

              <span>Obi Cosmetics</span>

            </a>

            <div class="nav-actions">

             <button class="menu-button">
               Menu
             </button>

              <button
                 id="open-cart-button"
                 class="cart-button"
                 type="button"
                 aria-label="Open shopping cart"
                >

                   <svg
                     class="cart-icon"
                      viewBox="0 0 24 24"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="2"
                      stroke-linecap="round"
                        stroke-linejoin="round"
                        aria-hidden="true"
                    >
                       <circle cx="9" cy="20" r="1"></circle>
                       <circle cx="19" cy="20" r="1"></circle>

                       <path
                           d="M3 4h2l2.5 11h10l2-7H7"
                       ></path>
                  </svg>

                  <span id="cart-count" class="cart-count">
                      0
                  </span>

                </button>

            </div>

        </nav>
    </header>


    <main>

        <section class="hero">

            <h1>
                Discover Our Products
            </h1>

            <p>
                Quality products delivered directly to you.
            </p>

            <a href="#products" class="shop-button">
                Shop Now
            </a>

        </section>


        <section id="products" class="products-section">

         <h2>Best Sellers</h2>

         <div id="product-grid" class="product-grid">

         </div>
 
        </section>

    </main>

<!-- CART OVERLAY -->

<div
    id="cart-overlay"
    class="cart-overlay"
></div>


<!-- CART DRAWER -->

<aside
    id="cart-drawer"
    class="cart-drawer"
>

    <div class="cart-drawer-header">

        <h2>Your Cart</h2>

        <button
            id="close-cart-button"
            class="close-cart-button"
            type="button"
            aria-label="Close cart"
        >
            ×
        </button>

    </div>


    <div
        id="cart-items"
        class="cart-items"
    >
    </div>


    <div class="cart-drawer-footer">

        <div class="cart-subtotal">

            <span>Subtotal</span>

            <strong id="cart-subtotal">
                LE 0
            </strong>

        </div>


        <button
            id="cart-checkout-button"
            class="cart-checkout-button"
            type="button"
        >
            Go to Checkout
        </button>


        <button
            id="continue-shopping-button"
            class="continue-shopping-button"
            type="button"
        >
            Continue Shopping
        </button>

    </div>

</aside>

    <footer>

        <p>
            © 2026 Obi Cosmetics
        </p>

    </footer>


    <script src="products.js"></script>
    <script src="script.js"></script>

</body>

</html>
